name: Branch validation (no APK builds)

on:
  push:
    branches:
      - fix/android-media-origin-island
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spotube-guest-onboarding-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.35.2'

jobs:
  analyze:
    name: Generate code and analyze Dart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Create non-secret development configuration
        run: |
          printf 'ENABLE_UPDATE_CHECK=0\nLASTFM_API_KEY=xxx\nLASTFM_API_SECRET=xxx\nRELEASE_CHANNEL=nightly\nHIDE_DONATIONS=1\n' > .env
      - name: Install packages
        run: flutter pub get
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Analyze Dart
        run: dart analyze --no-fatal-warnings
      - name: Check formatting of changed Dart files
        run: |
          dart format --output=none --set-exit-if-changed \
            lib/collections/routes.dart \
            lib/pages/home/home.dart \
            lib/modules/home/sections/sections.dart \
            lib/modules/home/sections/new_releases.dart \
            lib/pages/settings/metadata/metadata_form.dart \
            lib/provider/audio_player/audio_player_streams.dart \
            lib/services/audio_services/mobile_audio_service.dart \
            lib/services/audio_services/origin_island_bridge.dart

