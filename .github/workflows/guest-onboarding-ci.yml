name: Branch validation and Android test APK

on:
  push:
    branches:
      - fix/guest-onboarding
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spotube-guest-onboarding-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.35.2'

jobs:
  analyze:
    name: Generate code and analyze Dart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Create non-secret development configuration
        run: |
          printf 'ENABLE_UPDATE_CHECK=0\nLASTFM_API_KEY=xxx\nLASTFM_API_SECRET=xxx\nRELEASE_CHANNEL=nightly\nHIDE_DONATIONS=1\n' > .env
      - name: Install packages
        run: flutter pub get
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Analyze Dart
        run: dart analyze --no-fatal-warnings
      - name: Check formatting of changed Dart files
        run: |
          dart format --output=none --set-exit-if-changed \
            lib/collections/routes.dart \
            lib/pages/home/home.dart \
            lib/modules/home/sections/sections.dart \
            lib/modules/home/sections/new_releases.dart \
            lib/pages/settings/metadata/metadata_form.dart

  android-debug:
    name: Build installable Android dev APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Create non-secret development configuration
        run: |
          printf 'ENABLE_UPDATE_CHECK=0\nLASTFM_API_KEY=xxx\nLASTFM_API_SECRET=xxx\nRELEASE_CHANNEL=nightly\nHIDE_DONATIONS=1\n' > .env
      - name: Prepare ephemeral Android test signing
        run: |
          keytool -genkeypair -noprompt -keystore android/app/spotube-ci-test.jks \
            -alias spotube-ci-test -keyalg RSA -keysize 2048 -validity 7 \
            -storepass android-ci-test -keypass android-ci-test \
            -dname 'CN=Spotube CI Test,O=Development,C=US'
          printf 'storePassword=android-ci-test\nkeyPassword=android-ci-test\nkeyAlias=spotube-ci-test\nstoreFile=spotube-ci-test.jks\n' > android/key.properties
      - name: Install packages
        run: flutter pub get
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Build Android dev APK
        run: flutter build apk --debug --flavor dev --target lib/main.dart --no-pub
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: spotube-guest-onboarding-dev-apk
          path: build/app/outputs/flutter-apk/app-dev-debug.apk
          if-no-files-found: error
          retention-days: 7
